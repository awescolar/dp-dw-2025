<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Responsivo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <h1>Minha Loja</h1>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-icon">
        ☰
    </label>

    <nav class="nav">
        <a href="#">Home</a>
        <a href="#">Produtos</a>
        <a href="#">Carrinho</a>
        <a href="#">Contato</a>
    </nav>

</header>

<main class="container">

    <aside class="filtro">
        <h2>Filtros</h2>

        <button class="btn">Masculino</button>
        <button class="btn">Feminino</button>
        <button class="btn">Promoção</button>
    </aside>

    <section class="galeria">

        <div class="produto">Produto 1</div>
        <div class="produto">Produto 2</div>
        <div class="produto">Produto 3</div>
        <div class="produto">Produto 4</div>
        <div class="produto">Produto 5</div>
        <div class="produto">Produto 6</div>
        <div class="produto">Produto 7</div>
        <div class="produto">Produto 8</div>
        <div class="produto">Produto 9</div>
        <div class="produto">Produto 10</div>
        <div class="produto">Produto 11</div>
        <div class="produto">Produto 12</div>

    </section>

</main>

<footer class="footer">
    <p>© 2026 Minha Loja</p>
</footer>

</body>
</html>
