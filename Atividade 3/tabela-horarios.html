<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de Horários</title>
</head>
<body>
    <h1>Horários de Aula</h1>
    <table border="1">
        <thead>
            <tr>
                <th rowspan="2">Dia</th>
                <th colspan="2">Manhã</th>
                <th colspan="2">Tarde</th>
            </tr>
            <tr>
                <th>8h-10h</th>
                <th>10h-12h</th>
                <th>14h-16h</th>
                <th>16h-18h</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Segunda</td>
                <td>Matemática</td>
                <td>Português</td>
                <td>História</td>
                <td>Geografia</td>
            </tr>
            <tr>
                <td>Terça</td>
                <td>Ciências</td>
                <td>Artes</td>
                <td>Educação Física</td>
                <td>Inglês</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="5">Horários sujeitos a alterações</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
