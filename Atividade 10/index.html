<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Bem-vindo à Nossa Landing Page</h1>
        <nav>
            <ul>
                <li><a href="#sobre">Sobre</a></li>
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="sobre">
            <h2>Sobre Nós</h2>
            <p>Somos uma empresa dedicada a soluções inovadoras.</p>
            <img src="placeholder.jpg" alt="Imagem de exemplo" width="300">
        </section>
        
        <section id="servicos">
            <h2>Nossos Serviços</h2>
            <ul>
                <li>Consultoria</li>
                <li>Desenvolvimento Web</li>
                <li>Marketing Digital</li>
            </ul>
        </section>
        
        <section id="contato">
            <h2>Contato</h2>
            <form action="#" method="post">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required><br>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Nossa Empresa. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
